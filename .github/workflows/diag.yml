# temporary diagnostic (started by hand): the engine with MSVC under several flags
name: diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build and run
        shell: cmd
        run: |
          cd csrc
          cl 2>&1 | findstr /C:"Version"
          set SRC=dfl_special.c dfl_mgf.c dfl_single.c dfl_gen.c dfl_moments.c dfl_double.c dfl_gilpelaez.c dfl_api.c dfl_threads.c tables.c Faddeeva.cc faddeeva_shim.cpp
          echo ==== /O2
          cl /nologo /O2 /std:c11 /I. /Fe:d1.exe ..\tools\diag\diag.c %SRC% > b1.log 2>&1
          d1.exe
          echo ==== /O2 /fp:strict
          cl /nologo /O2 /fp:strict /std:c11 /I. /Fe:d2.exe ..\tools\diag\diag.c %SRC% > b2.log 2>&1
          d2.exe
          echo ==== /Od
          cl /nologo /Od /std:c11 /I. /Fe:d3.exe ..\tools\diag\diag.c %SRC% > b3.log 2>&1
          d3.exe
          echo ==== /O2 /DDFL_QUIET /MD /GL
          cl /nologo /O2 /GL /MD /DNDEBUG /DDFL_QUIET /std:c11 /I. /Fe:d4.exe ..\tools\diag\diag.c %SRC% > b4.log 2>&1
          d4.exe
          echo ==== /O1
          cl /nologo /O1 /std:c11 /I. /Fe:d5.exe ..\tools\diag\diag.c %SRC% > b5.log 2>&1
          d5.exe
          exit /b 0
